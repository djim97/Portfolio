<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Djimouna Bacary Badji · Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- description et og:description sont posees par core/seo.ts,
       depuis profile.data.ts, et figees ici au prerendu. -->
  <meta name="author" content="Djimouna Bacary BADJI">
  <meta name="theme-color" content="#0E0D0B">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="Djimouna Bacary Badji · Portfolio">
  <meta property="og:url" content="https://djimouna-badji.netlify.app/">
  <meta property="og:image" content="https://djimouna-badji.netlify.app/og-image.png">
  <!-- Dimensions declarees : sans elles, LinkedIn saute souvent l'apercu au
       premier passage, le temps de telecharger l'image pour la mesurer. -->
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Portfolio de Djimouna Bacary Badji, élève ingénieur en informatique à Dakar">
  <meta property="og:site_name" content="Djimouna Bacary Badji">
  <meta property="og:locale" content="fr_SN">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="canonical" href="https://djimouna-badji.netlify.app/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600&family=Geist:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Pose le theme et le drapeau "js" avant le premier rendu.
       Sans ce script : theme sombre, et aucun contenu masque par les animations. -->
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('theme');
        theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch (e) { /* stockage indisponible : on garde le sombre */ }
      root.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
