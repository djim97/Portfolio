<section class="section">
  <div class="wrap">
    <app-section-head label="projets" heading="Ce que j'ai construit" appReveal />
    <p class="lead intro" appReveal [appRevealDelay]="60">
      Travaux d'école, projets d'équipe et projets personnels. Chaque fiche indique la pile
      technique réellement utilisée.
    </p>

    <div class="grid">
      @for (project of projects; track project.slug) {
        <app-project-card [project]="project" appReveal [appRevealDelay]="($index % 3) * 90" />
      }
    </div>

    <p class="outro" appReveal>
      Mes exercices d'algorithmique et de langage C restent accessibles sur
      <a [href]="id.github" target="_blank" rel="noopener" class="outro-link">
        <app-icon name="github" /> mon GitHub <span class="arrow" aria-hidden="true"><app-icon name="arrow-out" /></span>
      </a>.
    </p>
  </div>
</section>
